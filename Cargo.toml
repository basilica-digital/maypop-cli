[package]
name = "maypop-cli"
version = "0.1.0"
edition = "2021"
description = "Build and publish Maypop apps from the command line."
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/basilica-digital/maypop-cli"
publish = false

[features]
default = []
admin = []

[[bin]]
name = "maypop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
tokio = { version = "1.32", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = { version = "0.25", default-features = false, features = ["display", "parse"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.4"
mime_guess = "2.0"
