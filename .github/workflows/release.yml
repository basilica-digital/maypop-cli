name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        run: |
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Test
        run: cargo test --locked

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: maypop
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            executable: maypop
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            executable: maypop
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: maypop.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="maypop-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }}"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" maypop
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "maypop-$env:GITHUB_REF_NAME-${{ matrix.target }}.${{ matrix.archive }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.executable }}" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          $checksum = "$hash  $archive`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "$archive.sha256"),
            $checksum,
            [System.Text.UTF8Encoding]::new($false)
          )
      - uses: actions/upload-artifact@v4
        with:
          name: maypop-${{ matrix.target }}
          path: |
            maypop-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
            maypop-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: maypop-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Maypop CLI $GITHUB_REF_NAME"
